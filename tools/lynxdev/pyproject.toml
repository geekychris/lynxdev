[project]
name = "lynxdev"
version = "0.1.0"
description = "Atari Lynx dev harness: scriptable Handy host, CLI, MCP server and DevBench (web UI + REST)"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10",
  "numpy>=1.24",           # asset tools (sprites, palettes)
  "mcp>=2.3,<3",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.scripts]
lynxdev = "lynxdev.cli:main"
lynxdev-mcp = "lynxdev.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lynxdev"]
